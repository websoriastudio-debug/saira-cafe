name: Publicar SAIRA Cafe en GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'saira-cafe-github-pages.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4
      - name: Extraer la web
        run: |
          test -f saira-cafe-github-pages.zip || (echo "Falta subir saira-cafe-github-pages.zip a la raiz del repositorio." && exit 1)
          mkdir -p _site
          unzip -q saira-cafe-github-pages.zip -d _site
          test -f _site/index.html
          test -f _site/css/styles.css
          test -f _site/js/app.js
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
